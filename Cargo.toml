[package]
name = "granade-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "signal", "process", "net", "fs", "time", "io-util"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
axum = "0.8.9"
clap = { version = "4.6.2", features = ["derive"] }
hex = "0.4.3"
